<!-- Delete Modal -->
<div class="modal fade" id="deleteModal{{ u.pk }}" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-danger text-white border-0">
                <h5 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle me-2"></i>Konfirmasi Hapus</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 text-start">
                <p class="mb-2">Apakah Anda yakin ingin menghapus user <strong>{{ u.username }}</strong>?</p>
                <div class="p-3 bg-light rounded-3 mb-0">
                    <div class="small text-muted mb-1">Nama Lengkap:</div>
                    <div class="fw-semibold text-dark">{{ u.get_full_name|default:"-" }}</div>
                </div>
                <p class="text-danger small mt-3 mb-0">
                    <i class="bi bi-info-circle me-1"></i>
                    Semua data pengajuan milik user ini juga akan ikut terhapus secara permanen.
                </p>
            </div>
            <div class="modal-footer border-0 bg-light bg-opacity-50">
                <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Batal</button>
                <form method="post" action="{% url 'users:user_delete' u.pk %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-1"></i>Ya, Hapus
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
