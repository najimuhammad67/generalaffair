{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to GA System">
    <title>Login — GA System</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        /* Override for login page - make it standalone */
        body {
            background: #F8F9FB;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .page-container {
            padding: 24px;
            display: block !important;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">⚡</div>
        <h3>GA System</h3>
        <p class="login-subtitle">Enterprise General Affair Management</p>

        {% if form.errors %}
        <div class="alert alert-danger py-2 d-flex align-items-center gap-2" style="font-size:0.88rem;">
            <i class="bi bi-exclamation-triangle"></i>
            Username atau password salah.
        </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label for="id_password" class="form-label">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </button>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="footer-ga mt-auto">
    <div class="container text-center text-muted small">
        &copy; 2026 GA System. All rights reserved.
    </div>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
